name: Android app

on:
  push:
    branches:
      - main
      - admin-website
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project around the app code
        run: |
          flutter create --platforms=android --org org.twahirah --project-name twahirah_online_school .
          rm -rf test
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Twahirah School"', s, count=1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application\n        android:usesCleartextTraffic="true"', 1)
          open(p, 'w').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Get packages and make the app icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Check the code
        run: flutter analyze --no-fatal-infos

      - name: Build the APK
        run: flutter build apk --release --dart-define=SCHOOL_URL=${{ vars.SCHOOL_URL || 'https://twahirah-online-school.onrender.com' }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/twahirah-online-school.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: twahirah-online-school-apk
          path: mobile/build/twahirah-online-school.apk
          retention-days: 30
