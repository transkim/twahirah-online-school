# One-click setup on Render (render.com): New > Blueprint > choose this repository.
services:
  - type: web
    name: twahirah-online-school
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Twahirah Online School
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: twahirah-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # Asked for during setup; the first administrator's sign-in.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Test copy: made-up students and teachers only. Turn off before real data goes online.
      - key: DEMO_DATA
        value: "true"
      # Password for the sample sign-ins teacher.demo and student.demo.
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: twahirah-db
    plan: free
